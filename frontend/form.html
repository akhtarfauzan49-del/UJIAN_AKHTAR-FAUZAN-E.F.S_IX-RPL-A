<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM PEMINJAMAN</title>
    <link rel="stylesheet" href="./dist/output.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="mt-3 mx-6">
        <nav class="flex justify-between bg-blue-900 px-10 py-4 rounded-md text-gray-100">
            <div class="text-lg font-mono px-5">
                <h1>Peminjaman Alat Sekolah</h1>
            </div>

            <div class="flex gap-5 font-mono mr-15 items-center">
                <a href="alat.html#" class="hover:bg-blue-700 px-2 py-1 rounded-md">Dasboard</a>
                <a href="form.html#" class="hover:bg-blue-700 px-2 py-1 rounded-md">Peminjaman</a>
                <a href="daftar.html#" class="hover:bg-blue-700 px-2 py-1 rounded-md">Status</a>
                <a href="edit.html" class="hover:bg-blue-700 px-2 py-1 rounded-md">Edit</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="bg-gray-200 mx-130  mt-10 mb-10 rounded-xl shadow-lg">
            <div class="flex flex-col items-center ">
                <h1 class="font-mono ">Selamat Datang</h1>
                <p>Di Form Peminjam Alat</p>
            </div>

            <form id="form-pinjam">

                <div>
                    <label>Nama Peminjam:</label>
                    <input type="text">
                </div>

                <div>
                    <label for="kelas">Kelas:</label>
                    <input type="text">
                </div>


                <div>
                    <label id="id_kategori">Kategori Alat:</label>
                    <select>
                        <option value="">-- Pilih Kategori --</option>
                    </select>
                </div>

                <div>
                    <label id="id_alat">Nama Alat:</label>
                    <select>
                        <option value="">-- Pilih Alat --</option>
                    </select>
                </div>

                <div>
                    <label>Jumlah:</label>
                    <input type="number">
                </div>

                <div>
                    <label>Tanggal Pinjam:</label>
                    <input type="date">
                </div>

                <div>
                    <label>Tanggal Kembali:</label>
                    <input type="date">
                </div>

                <div>
                    <button type="submit">Pinjam</button>
                </div>
            </form>
        </section>


        <footer class=" mx-6 mb-6">
            <div class="bg-blue-900 text-gray-100 rounded-md px-10 py-4 font-mono text-center shadow-lg">
                <p class="font-bold text-base mb-1">Peminjaman Alat Sekolah</p>
                <p class="text-sm text-gray-300 mb-2">Sistem informasi pencatatan dan pengelolaan peminjaman alat
                    sekolah.</p>
                <small class="text-xs text-gray-400">&copy; 2026 Akhtar Fauzan</small>
            </div>
        </footer>
    </main>
    <script src="js/Form.js"></script>
</body>

</html>
