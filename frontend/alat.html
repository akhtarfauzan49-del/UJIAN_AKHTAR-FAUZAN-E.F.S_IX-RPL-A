<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasboard</title>
    <link rel="stylesheet" href="./dist/output.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">
    <header class="mt-3 mx-6">
        <nav class="flex justify-between bg-blue-900 px-10 py-4 rounded-md text-gray-100">
            <div class="text-lg font-mono px-5">
                <h1>Peminjaman Alat Sekolah</h1>
            </div>

            <div class="flex gap-8 font-mono mr-15 items-center">
                <a href="alat.html#">Dasboard</a>
                <a href="form.html#">Peminjaman</a>
                <a href="daftar.html#">Status</a>
                <a href="edit.html">Edit</a>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="font-mono text-lg mt-6 ml-9 mb-5">
                <h2 class="">Daftar Alat Yang Tersedia</h2>
            </div>

            <div class="ml-8 bg-slate-300 rounded-md mr-8 py-2 shadow-lg">
                <table class="w-full border-collapse font-mono">
                    <thead>
                        <tr class="border-b border-slate-400 text-gray-800 text-sm">
                            <th class="py-2.5 px-3">No</th>
                            <th class="py-2.5 px-3 text-left">Nama Alat</th>
                            <th class="py-2.5 px-3">Kategori</th>
                            <th class="py-2.5 px-3">Stok</th>
                            <th class="py-2.5 px-3">Lokasi</th>
                            <th class="py-2.5 px-3">Kondisi</th>
                            <th class="py-2.5 px-3">Pinjam</th>
                            <th class="py-2.5 px-3">Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="data-alat">
                        
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="mt-88 mx-6 mb-6">
            <div class="bg-blue-900 text-gray-100 rounded-md px-10 py-4 font-mono text-center shadow-lg">
                <p class="font-bold text-base mb-1">Peminjaman Alat Sekolah</p>
                <p class="text-sm text-gray-300 mb-2">Sistem informasi pencatatan dan pengelolaan peminjaman alat
                    sekolah.</p>
                <small class="text-xs text-gray-400">&copy; 2026 Akhtar Fauzan</small>
            </div>
        </footer>
    </main>

    <script src="js/Dasboard.js"></script>
</body>

</html>
